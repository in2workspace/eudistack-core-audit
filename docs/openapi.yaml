openapi: 3.1.0
info:
  title: EUDIStack — Audit API
  version: "1"
  summary: Record and query audit events.
  description: |
    Single audit API of the platform.
    Platform systems record events (write only). Clients and the platform administrator query them
    (read only). No operation modifies or deletes an event.
    Each event is validated against the audit event catalogue (`catalogo-eventos.yaml`): only the
    types, versions and `details` fields it declares are accepted.
    Errors follow the RFC 9457 problem details shape. `type` is an error code; the codes of each
    HTTP status are listed in its response.
  contact:
    name: EUDIStack
    url: https://eudistack.net
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{tenant}.{environment}.eudistack.net/audit
    description: Tenant endpoint. Query only.
    variables:
      tenant:
        default: sandbox
      environment:
        default: stg
  - url: https://audit.internal.{environment}.eudistack.net
    description: Internal platform endpoint, not reachable from the Internet. Write only.
    variables:
      environment:
        default: stg
tags:
  - name: Write
    description: Recording of audit events by platform systems.
  - name: Query
    description: Read-only query of audit events.

paths:
  /api/v1/events:
    post:
      tags: [Write]
      operationId: recordEvents
      summary: Record audit events
      description: |
        Records a batch of 1 to 100 events, of one or several tenants. Each event is validated and
        stored on its own: an invalid event does not prevent the others from being stored.
        Idempotent by `event_id`: an event already stored with the same content gets `duplicate`.
        A rejected event is stored as received as `AuditEventRejected` in `platform`, so the producer
        removes every `accepted`, `duplicate` and `rejected` event from its outbox and retries only on 503.
        Requires the power `organization · EUDISTACK · Audit · Write`. A rejected authentication or
        permission is recorded as `AuditWriteDenied`.
      servers:
        - url: https://audit.internal.{environment}.eudistack.net
          variables:
            environment:
              default: stg
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventBatch" }
            examples:
              issuance:
                summary: Issuance completed through the wallet
                value:
                  events:
                    - event_id: 5d1c7a40-2f0e-4b8a-9a61-0c3e5f7d2b11
                      event_type: IssuanceCompleted
                      event_version: 2.0.0
                      occurred_at: "2026-10-01T09:12:44Z"
                      tenant: red-logistica
                      organization: VATES-B00000000
                      source: issuer
                      actor: { kind: System, id: issuer }
                      action: Issue
                      resource: "issuance:0b6f1d2e-8c4a-4b1f-9e2d-7a5c3f8e1b90"
                      result: Success
                      correlation_id: 0b6f1d2e-8c4a-4b1f-9e2d-7a5c3f8e1b90
                      details:
                        provider_legal_name: Red Logística S.L.
                        provider_registration_id: VATES-B00000000
                        attestation_type: employee.sd.1
                        delivery_method: email
                        holder:
                          identifier: "12345678Z"
                          name: María García López
                          email: maria.garcia@red-logistica.example
                        issued_attributes: [given_name, family_name, employee_id, role]
                        valid_from: "2026-10-01T09:12:44Z"
                        valid_until: "2027-10-01T09:12:44Z"
                        signing_certificate: "sha256:9f2c…"
                        signature_algorithm: ES256
                        attestation_hash: "sha256:41ab…"
                        wallet_interaction: { protocol: oid4vci, grant_type: pre-authorized_code, format: dc+sd-jwt }
                        accepted_by_holder: true
      responses:
        "200":
          description: Result of each event, in the order received.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventBatchResult" }
              examples:
                mixed:
                  summary: One stored, one duplicate, one rejected
                  value:
                    results:
                      - { event_id: 5d1c7a40-2f0e-4b8a-9a61-0c3e5f7d2b11, status: accepted }
                      - { event_id: 8a2e1f33-7c4d-4e0b-b1a2-3d4c5e6f7a80, status: duplicate }
                      - event_id: c0ffee00-1111-4222-8333-444455556666
                        status: rejected
                        error:
                          type: invalid_event
                          title: The event does not match its type
                          status: 422
                          violations:
                            - { field: details.holder_phone, message: Field not declared by IssuanceCompleted 2.0.0 }
        "400":
          description: |
            `type` `BAD_REQUEST`: the batch is not valid (not JSON, no `events`, more than 100 events),
            with `violations`. Nothing is stored.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`type` `insufficient_permission`: the caller lacks `Audit · Write`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: "`type` `service_unavailable`: the audit store is not available. Nothing is stored; retry the whole batch after `Retry-After`."
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

    get:
      tags: [Query]
      operationId: listEvents
      summary: List audit events
      description: |
        Returns the events within the caller's scope, oldest first, paginated.
        `Audit · Read` of type `organization` gives the whole tenant; of type `domain`, only the
        events whose `organization` is the caller's. The platform administrator, from the platform
        tenant, chooses the scope with `tenant`.
        The period is at most 31 days and must fall within the 90-day online period, the same for all
        tenants; older periods are archived and are not served by this API.
        With `details_path` and `details_value`, returns only the events whose `details` contain that
        value at that path (exact match). The path must be declared `searchable` by every type in
        `event_type`, which is then required, and `from` is required.
        Every call, granted or denied, is recorded as `AuditTrailQueried`.
      parameters:
        - name: from
          in: query
          required: false
          description: Start of the period (`occurred_at`, inclusive). Default, 7 days before `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: End of the period (`occurred_at`, exclusive). Default, now.
          schema: { type: string, format: date-time }
        - name: event_type
          in: query
          required: false
          description: One or more event types, comma-separated.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: result
          in: query
          required: false
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/Result" } }
        - name: correlation_id
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: resource
          in: query
          required: false
          description: "Exact resource, e.g. `issuance:0b6f1d2e-…`."
          schema: { type: string, maxLength: 200 }
        - name: actor_id
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: details_path
          in: query
          required: false
          description: "Dot path inside `details`, declared `searchable` in the catalogue, e.g. `holder.identifier`. Requires `details_value`, `event_type` and `from`."
          schema: { type: string, maxLength: 100, pattern: "^[a-z_]+(\\.[a-z_]+)*$" }
        - name: details_value
          in: query
          required: false
          description: Value to match exactly at `details_path`. Requires `details_path`.
          schema: { type: string, maxLength: 200 }
        - name: organization
          in: query
          required: false
          description: organizationIdentifier. Ignored for `domain` readers, who only see their own.
          schema: { type: string, maxLength: 100 }
        - name: tenant
          in: query
          required: false
          description: Platform administrator only, from the platform tenant. A tenant identifier, `platform` or `all`.
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          description: Value of `next_cursor` from the previous page.
          schema: { type: string }
      security:
        - bearer: []
      responses:
        "200":
          description: The matching events. An empty list when nothing matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "400":
          description: |
            The request is not valid. `type`:
            - `BAD_REQUEST` — wrong parameter format, period longer than 31 days, `from` after `to`, or invalid cursor, with `violations`.
            - `unknown_event_type` — an `event_type` is not in the catalogue.
            - `path_not_searchable` — `details_path` is not declared `searchable` by every type in `event_type`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            `type` `period_archived`: part of the period is older than the 90-day online period.
            `detail` gives the oldest instant still online.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/events/{event_id}:
    get:
      tags: [Query]
      operationId: getEvent
      summary: Get an audit event
      description: Returns one event, as stored. Recorded as `AuditTrailQueried`.
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearer: []
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        "400":
          description: "`type` `BAD_REQUEST`: the identifier is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            `type` `event_not_found`: the event does not exist, is outside the caller's scope or is
            archived. All cases get the same response.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Access token issued by the Verifier, for a person (H2M) or a system (M2M). Write requires
        `organization · EUDISTACK · Audit · Write`. Query requires `organization · <tenant> · Audit · Read`,
        `domain · <tenant> · Audit · Read` or `organization · EUDISTACK · System · Administration`.

  responses:
    Unauthorized:
      description: |
        The access token is missing, invalid or expired. `type`:
        - `invalid_token` — the token is not valid or has expired.
        - `authentication_error` — the token is missing or authentication failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        The request is not allowed. `type`:
        - `tenant_mismatch` — the request tenant is not the tenant of the caller's attestation, or `tenant` was sent by someone who is not the platform administrator.
        - `tenant_not_resolved` — no tenant could be resolved for the request.
        - `insufficient_permission` — the caller lacks a read power.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: "`type` `rate_limited`: the volume limit was exceeded. Retry after the time in `Retry-After`."
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: "`type` `INTERNAL_SERVER_ERROR`: unexpected error."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Result:
      type: string
      enum: [Success, Denied, Failure]

    Actor:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [Person, System, Holder] }
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        organization: { type: string }
        attestation_id: { type: string }
      additionalProperties: false

    AuditEventInput:
      type: object
      description: Event as sent by a producing system. `details` is validated against its type in the catalogue.
      required: [event_id, event_type, event_version, occurred_at, tenant, source, actor, action, resource, result, correlation_id, details]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        event_version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
        occurred_at: { type: string, format: date-time }
        tenant: { type: string, description: "Tenant identifier or `platform`." }
        organization: { type: string }
        source: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
        action: { type: string }
        resource: { type: string }
        result: { $ref: "#/components/schemas/Result" }
        reason: { type: string, description: Required when `result` is not `Success`. }
        correlation_id: { type: string }
        details: { type: object }
      additionalProperties: false

    AuditEvent:
      description: Event as stored and returned.
      allOf:
        - $ref: "#/components/schemas/AuditEventInput"
        - type: object
          required: [recorded_at]
          properties:
            recorded_at: { type: string, format: date-time, description: Set by the audit API. }

    EventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/AuditEventInput" }

    EventBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [event_id, status]
            properties:
              event_id: { type: string }
              status:
                type: string
                enum: [accepted, duplicate, rejected]
              error:
                description: |
                  Only with `rejected`. The event is stored as `AuditEventRejected` in `platform`. `type`:
                  - `unknown_event_type` — the type or version is not in the catalogue.
                  - `invalid_event` — the event does not match its type, with `violations`.
                  - `unknown_tenant` — the tenant does not exist.
                  - `event_id_conflict` — the `event_id` is already stored with different content.
                allOf:
                  - $ref: "#/components/schemas/Problem"

    EventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor:
          type: [string, "null"]
          description: Cursor of the next page, or null on the last page.

    Problem:
      type: object
      description: Problem details (RFC 9457 shape). `type` is an error code.
      required: [type, title, status]
      properties:
        type: { type: string, description: Error code. The codes of each HTTP status are listed in its response. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        violations:
          type: array
          description: Field-level violations, for data errors.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

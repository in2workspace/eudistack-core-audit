# Audit API service. Every value can be overridden by environment variables (relaxed binding):
# AUDIT_ROLE, AUDIT_SECURITY_JWKS_URI, AUDIT_DATASOURCE_WRITER_URL, …
server:
  port: ${SERVER_PORT:8080}
  # X-Forwarded-Host / X-Forwarded-Prefix from the load balancer (PO-9: only reachable through it).
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  jackson:
    default-property-inclusion: non_null

management:
  server:
    # Actuator off the API port and off the public ingress (SAD-DEC-010).
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  # OTLP/gRPC export to the OTel Collector → OpenObserve. Exports default off:
  # local runs and tests must not try to export.
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
        step: 5s
        resource-attributes:
          service.name: ${spring.application.name}
    tracing:
      transport: grpc
      endpoint: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:false}
    logging:
      # INFO and above only (threshold of the OTLP appender in logback-spring.xml)
      endpoint: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
      transport: ${MANAGEMENT_OTLP_LOGGING_TRANSPORT:grpc}
      export:
        enabled: ${MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED:false}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    # Field names of design §3.10: trace_id, span_id (MDC of Micrometer Tracing) and service.name.
    json:
      rename:
        traceId: trace_id
        spanId: span_id
      add:
        "[service.name]": ${spring.application.name}
  level:
    root: INFO
    com.eudistack.audit: ${LOG_LEVEL:INFO}

audit:
  # writer | reader | archiver | all | provisioner (design §3.2). `all` is for local and CI only.
  role: ${AUDIT_ROLE:all}
  web:
    internal-hosts:
      - 'audit\.internal\..+'
    tenant-header: X-Tenant-Id
    environment-suffixes: [-stg, -dev, -pre]
    # Addresses that may send tenant-header. Empty: the header is ignored and the tenant comes from the host.
    trusted-proxies: []
    max-body-bytes: ${AUDIT_WEB_MAX_BODY_BYTES:5242880}
  security:
    jwks-uri: ${AUDIT_SECURITY_JWKS_URI:}
    # e.g. https://{tenant}.stg.eudistack.net/verifier,https://{tenant}-stg.eudistack.net/verifier
    trusted-issuers: ${AUDIT_SECURITY_TRUSTED_ISSUERS:}
    # Required for roles writer and reader. Role all (local and CI) may leave it empty until the Verifier emits one (PO-12).
    audience: ${AUDIT_SECURITY_AUDIENCE:}
  datasource:
    writer:
      url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit}
      username: ${AUDIT_DB_WRITER_USER:audit_writer}
      password: ${AUDIT_DB_WRITER_PASSWORD:}
    reader:
      url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit}
      username: ${AUDIT_DB_READER_USER:audit_reader}
      password: ${AUDIT_DB_READER_PASSWORD:}
    archiver:
      url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit}
      username: ${AUDIT_DB_ARCHIVER_USER:audit_archiver}
      password: ${AUDIT_DB_ARCHIVER_PASSWORD:}
    migrator:
      url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit}
      username: ${AUDIT_DB_MIGRATOR_USER:audit_migrator}
      password: ${AUDIT_DB_MIGRATOR_PASSWORD:}
  query:
    cursor-secret: ${AUDIT_QUERY_CURSOR_SECRET:}
  archive:
    storage: ${AUDIT_ARCHIVE_STORAGE:s3}
    bucket: ${AUDIT_ARCHIVE_BUCKET:}
    region: ${AWS_REGION:eu-west-1}
    endpoint: ${AUDIT_ARCHIVE_ENDPOINT:}
  provisioner:
    tenants: ${AUDIT_PROVISIONER_TENANTS:}
